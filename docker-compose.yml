version: '3.9'

services:
  location-service:
    container_name: locations
    build:
      context: ./location-service
      dockerfile: Dockerfile
    ports:
      - "6002:6002"
      - "3345:3345"
    env_file:
      - ./location-service/.env
    networks:
      - app-network

  restaurant-service:
    container_name: restaurant-service
    build:
      context: ./restaurant-service
      dockerfile: Dockerfile
    networks:
      - app-network

  vehicle-service:
    container_name: vehicle-service
    build:
      context: ./vehicle-service
      dockerfile: Dockerfile
    networks:
      - app-network

  hotel-service:
    container_name: hotel-service
    build:
      context: ./hotel-service
      dockerfile: Dockerfile
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx-reverse-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - location-service
      - restaurant-service
      - vehicle-service
      - hotel-service
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
