name: CI/CD Pipeline - Deploy to EC2

on:
  push:
    branches:
      - dev/vehicle

jobs:
  build-and-deploy:
    name: Build, Push Docker Image & Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          set -e  # Exit on error
          
          IMAGE_NAME=${{ secrets.DOCKER_HUB_USERNAME }}/vehicles
          TAG=latest
          
          echo "🔹 Building Docker image..."
          docker build -t $IMAGE_NAME:$TAG .
          
          echo "🔹 Pushing Docker image to Docker Hub..."
          docker push $IMAGE_NAME:$TAG

      - name: Setup SSH Key and Disable Strict Host Key Checking
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > private_key.pem
          chmod 600 private_key.pem
          mkdir -p ~/.ssh
          echo "StrictHostKeyChecking no" >> ~/.ssh/config

      - name: SSH into EC2 & Deploy Using Docker Compose
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_DNS }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e  # Exit on error
            
            echo "🔹 Switching to deployment directory..."
            cd ${{ secrets.TARGET_DIR }} || exit 1

            echo "🔹 Logging in to Docker Hub..."
            echo "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

            echo "🔹 Pulling latest Docker image..."
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/vehicles:latest

            echo "🔹 Stopping and removing old containers..."
            docker-compose down --remove-orphans
            
            echo "🔹 Restarting services with new image..."
            docker-compose up -d --force-recreate

            echo "🔹 Cleaning up unused Docker images..."
            docker system prune -af
