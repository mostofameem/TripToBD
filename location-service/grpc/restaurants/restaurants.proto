syntax = "proto3";

option go_package = "location-service/grpc/restaurants";
package restaurants;

service RestaurantService {
  rpc addBranches (AddbranchesReq) returns (AddbranchesRes);
  rpc hello(Empty) returns (HelloResponse);
}

message HelloResponse {
  bool status = 1;
}

message Empty {
}
message AddbranchesReq {
  int32 location_id = 1;
  int32 restaurant_id=2;
  int32 branch_id = 3;
  int32 user_id = 4;
}

message AddbranchesRes {
  bool status =1;
}